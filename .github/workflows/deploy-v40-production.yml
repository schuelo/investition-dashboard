name: V40 Produktivstand veröffentlichen
on:
  workflow_dispatch:
    inputs:
      update_database:
        description: V40-Datenbankupdate auf das bestehende Depot anwenden
        type: boolean
        default: true
      configure_monitor:
        description: Zeitplan mit vorhandenem Vault-Secret einrichten
        type: boolean
        default: true
      publish_website:
        description: Website über GitHub Pages veröffentlichen (Pages-Quelle GitHub Actions)
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: investition-production
  cancel-in-progress: false
jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID || 'pzhfybtoyfttftgcrcxk' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Prüfwerkzeuge installieren
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Gesamte Anwendung und Datenbankmigrationen prüfen
        run: |
          node scripts/set-version.mjs --check
          node scripts/build-update-sql.mjs --check
          npm test
          npm run check:sql
      - name: V40-Datenbankupdate anwenden
        if: inputs.update_database
        run: node scripts/deploy-production.mjs migrate
      - name: Datenbankbereitschaft prüfen
        run: node scripts/deploy-production.mjs check
      - uses: supabase/setup-cli@v1
        with:
          version: 2.110.0
      - name: Basisanalyse und Kursautomatik bereitstellen
        run: supabase functions deploy review-investments --project-ref "$PROJECT_ID" --no-verify-jwt
      - name: Deep, Quellen und Produktprüfung bereitstellen
        run: supabase functions deploy analyze-deep-signal --project-ref "$PROJECT_ID" --no-verify-jwt
      - name: Vorhandenen Hintergrundzeitplan sicher einrichten
        if: inputs.configure_monitor
        run: node scripts/deploy-production.mjs scheduler
      - name: Website ohne Testdaten und Entwicklungsskripte vorbereiten
        run: node scripts/build-static.mjs
      - name: Website zur Veröffentlichung bereitstellen
        if: inputs.publish_website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  publish-pages:
    if: inputs.publish_website
    needs: validate-and-deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Website veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
