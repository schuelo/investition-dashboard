name: V31.2 TRIGGER KI deployen
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: pzhfybtoyfttftgcrcxk
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
      - name: Node für Modulprüfungen einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Rechen- und Regressionstests
        run: node --test tests/*.test.mjs
      - name: Supabase CLI einrichten
        uses: supabase/setup-cli@v1
        with:
          version: 2.110.0
      - name: Zugang und Modul prüfen
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo "::error::GitHub Secret SUPABASE_ACCESS_TOKEN fehlt."
            exit 1
          fi
          for file in signal-simulation.js signal-simulation.css setup-v31-signal-simulation.sql setup-v31-2-manual-triggers.sql supabase/functions/analyze-signal-path/index.ts supabase/functions/_shared/signal-engine.mjs supabase/functions/_shared/signal-service.mjs supabase/functions/_shared/signal-trigger.mjs; do
            if [[ ! -f "$file" ]]; then
              echo "::error file=$file::V31-Datei fehlt."
              exit 1
            fi
          done
      - name: Nur neue Signal-Function deployen
        run: supabase functions deploy analyze-signal-path --project-ref "$PROJECT_ID" --no-verify-jwt
      - name: Telegram-Ergänzung deployen
        run: supabase functions deploy send-news-alerts --project-ref "$PROJECT_ID" --no-verify-jwt
