name: Supabase Functions deployen

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: pzhfybtoyfttftgcrcxk

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Supabase CLI einrichten
        uses: supabase/setup-cli@v1
        with:
          # Feste Version verhindert eine unnötige "latest"-Abfrage und
          # hält den bereits getesteten V29.4-Deploy reproduzierbar.
          version: 2.110.0

      - name: Supabase CLI prüfen
        run: supabase --version

      - name: Zugangsdaten prüfen
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo "::error::GitHub Secret SUPABASE_ACCESS_TOKEN fehlt oder ist leer."
            exit 1
          fi
          if [[ -z "${PROJECT_ID:-}" ]]; then
            echo "::error::Supabase PROJECT_ID fehlt."
            exit 1
          fi
          echo "Supabase-Zugangsdaten sind für den Workflow gesetzt."

      - name: V29.4- und V30.1-Konsistenz prüfen
        shell: bash
        run: |
          set -euo pipefail

          require_file() {
            if [[ ! -f "$1" ]]; then
              echo "::error file=$1::Erforderliche Datei fehlt: $1"
              exit 1
            fi
          }

          forbid_file() {
            if [[ -f "$1" ]]; then
              echo "::error file=$1::Veraltete Datei darf nicht vorhanden sein: $1"
              exit 1
            fi
          }

          require_text() {
            local file="$1"
            local text="$2"
            if ! grep -Fq "$text" "$file"; then
              echo "::error file=$file::Erwartete Kennung fehlt: $text"
              exit 1
            fi
          }

          require_file supabase/functions/_shared/multisource-sources-v294.ts
          require_file supabase/functions/_shared/digest-logic.ts
          require_file supabase/functions/send-digest/index.ts
          require_file event-analysis.js
          require_file setup-v30-event-analysis.sql
          require_file supabase/functions/analyze-market-event/index.ts
          require_file supabase/functions/_shared/event-idea-engine.mjs

          forbid_file supabase/functions/_shared/hybrid-sources.ts
          forbid_file supabase/functions/_shared/multisource-sources-v2931.ts

          require_text supabase/functions/_shared/multisource-sources-v294.ts "export function gdeltDocUrl"
          require_text supabase/functions/sync-news/index.ts "multisource-sources-v294.ts"
          require_text supabase/functions/sync-news/index.ts "29.4-multisource-hybrid-market-intelligence-sync"
          require_text supabase/functions/send-news-alerts/index.ts "29.4-multisource-hybrid-portfolio-market-intelligence-alerts"
          require_text supabase/functions/send-digest/index.ts "29.4-multisource-hybrid-digest"
          require_text supabase/functions/analyze-market-event/index.ts 'const BUILD_VERSION = "30.1-independent-market-ideas"'
          require_text supabase/functions/analyze-market-event/index.ts "event-idea-engine.mjs"

          echo "V29.4- und V30.1-Dateistand ist konsistent."

      - name: News-Sync deployen
        run: supabase functions deploy sync-news --project-ref "$PROJECT_ID" --no-verify-jwt

      - name: Telegram-News deployen
        run: supabase functions deploy send-news-alerts --project-ref "$PROJECT_ID" --no-verify-jwt

      - name: Telegram-Berichte deployen
        run: supabase functions deploy send-digest --project-ref "$PROJECT_ID" --no-verify-jwt

      - name: Event- und Szenarioanalyse deployen
        run: supabase functions deploy analyze-market-event --project-ref "$PROJECT_ID" --no-verify-jwt
