name: Supabase Functions deployen

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: pzhfybtoyfttftgcrcxk
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Supabase CLI einrichten
        uses: supabase/setup-cli@v1
        with:
          # Eine feste Version vermeidet die GitHub-API-Abfrage für "latest",
          # die bei anonymen Actions-Läufen in ein Rate-Limit laufen kann.
          version: 2.110.0

      - name: Supabase CLI prüfen
        run: supabase --version

      - name: V29.4- und V30-Konsistenz prüfen
        run: |
          test -f supabase/functions/_shared/multisource-sources-v294.ts
          test -f supabase/functions/_shared/digest-logic.ts
          test -f supabase/functions/send-digest/index.ts
          test ! -f supabase/functions/_shared/hybrid-sources.ts
          test ! -f supabase/functions/_shared/multisource-sources-v2931.ts
          grep -q 'export function gdeltDocUrl' supabase/functions/_shared/multisource-sources-v294.ts
          grep -q 'multisource-sources-v294.ts' supabase/functions/sync-news/index.ts
          grep -q '29.4-multisource-hybrid-market-intelligence-sync' supabase/functions/sync-news/index.ts
          grep -q '29.4-multisource-hybrid-portfolio-market-intelligence-alerts' supabase/functions/send-news-alerts/index.ts
          grep -q '29.4-multisource-hybrid-digest' supabase/functions/send-digest/index.ts
          test -f event-analysis.js
          test -f setup-v30-event-analysis.sql
          test -f supabase/functions/analyze-market-event/index.ts
          grep -q '30.0-integrated-event-scenario-analysis' supabase/functions/analyze-market-event/index.ts

      - name: News-Sync deployen
        run: supabase functions deploy sync-news --project-ref "$PROJECT_ID" --no-verify-jwt

      - name: Telegram-News deployen
        run: supabase functions deploy send-news-alerts --project-ref "$PROJECT_ID" --no-verify-jwt

      - name: Telegram-Berichte deployen
        run: supabase functions deploy send-digest --project-ref "$PROJECT_ID" --no-verify-jwt

      - name: Event- und Szenarioanalyse deployen
        run: supabase functions deploy analyze-market-event --project-ref "$PROJECT_ID" --no-verify-jwt
