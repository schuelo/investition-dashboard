name: Supabase Functions deployen

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: pzhfybtoyfttftgcrcxk
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Supabase CLI einrichten
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: V29.3.1-Quellen prüfen
        run: |
          test -f supabase/functions/_shared/multisource-sources-v2931.ts
          grep -q 'export function gdeltDocUrl' supabase/functions/_shared/multisource-sources-v2931.ts
          grep -q 'multisource-sources-v2931.ts' supabase/functions/sync-news/index.ts

      - name: News-Sync deployen
        run: supabase functions deploy sync-news --project-ref "$PROJECT_ID" --no-verify-jwt

      - name: Telegram-News deployen
        run: supabase functions deploy send-news-alerts --project-ref "$PROJECT_ID" --no-verify-jwt
