name: V33 Papierdepot deployen
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: pzhfybtoyfttftgcrcxk
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Alle Tests ausführen
        run: node --test tests/*.test.mjs
      - uses: supabase/setup-cli@v1
        with:
          version: 2.110.0
      - name: Eigenständige Papierdepot-Function deployen
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SUPABASE_ACCESS_TOKEN" ]]; then
            echo "::error::GitHub Secret SUPABASE_ACCESS_TOKEN fehlt."
            exit 1
          fi
          supabase functions deploy paper-benchmark --project-ref "$PROJECT_ID" --no-verify-jwt
