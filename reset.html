<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dashboard V29.3 zurücksetzen</title>
  <style>
    body{margin:0;background:#07111f;color:#eef4ff;font:16px/1.5 system-ui,-apple-system,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px}
    main{max-width:560px;background:#101d2f;border:1px solid #29405f;border-radius:18px;padding:26px;box-shadow:0 18px 50px #0006}
    h1{font-size:24px;margin-top:0}p{color:#b8c7dc}button,a{display:inline-block;border:0;border-radius:10px;padding:12px 16px;font-weight:700;text-decoration:none;cursor:pointer}button{background:#45d2a0;color:#052017}a{background:#203653;color:#fff;margin-left:8px}.ok{color:#60e2ad}.bad{color:#ff8c8c}.note{color:#ffd27a}
  </style>
</head>
<body>
<main>
  <h1>Dashboard V29.3 zurücksetzen</h1>
  <p>Diese Seite löscht Service-Worker-Caches und Registrierungen. Deine Supabase-Daten, Depotpositionen und Analysen bleiben unverändert.</p>
  <p id="status">Bereit.</p>
  <button id="resetBtn">Jetzt zurücksetzen</button>
  <a id="dashboardLink" href="https://schuelo.github.io/investition-dashboard/?v=29.3">Dashboard öffnen</a>
</main>
<script>
const RESET_URL='https://schuelo.github.io/investition-dashboard/reset.html?v=29.3';
const canManageBrowserCache=location.origin!=='null' &&
  (location.protocol==='https:' ||
    (location.protocol==='http:' && ['localhost','127.0.0.1'].includes(location.hostname)));

async function resetDashboard(){
  const status=document.getElementById('status');
  const resetBtn=document.getElementById('resetBtn');

  if(!canManageBrowserCache){
    status.className='note';
    status.textContent='Der Reset muss über die veröffentlichte GitHub-Pages-Adresse geöffnet werden. Die Online-Seite wird jetzt geöffnet.';
    resetBtn.disabled=true;
    location.assign(RESET_URL);
    return;
  }

  try{
    status.textContent='Cache wird zurückgesetzt …';
    if('serviceWorker' in navigator){
      try{
        const regs=await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r=>r.unregister()));
      }catch(e){
        console.warn('Service-Worker-Registrierungen konnten nicht gelesen werden:',e);
      }
    }
    if('caches' in window){
      try{
        const names=await caches.keys();
        await Promise.all(names.map(n=>caches.delete(n)));
      }catch(e){
        console.warn('Browser-Caches konnten nicht gelesen werden:',e);
      }
    }
    status.className='ok';
    status.textContent='Erledigt. Das Dashboard wird neu geöffnet.';
    setTimeout(()=>location.replace('./?v=29.3&reset=1'),700);
  }catch(e){
    status.className='bad';
    status.textContent='Fehler: '+(e.message||String(e));
  }
}
document.getElementById('resetBtn').addEventListener('click',resetDashboard);

if(!canManageBrowserCache){
  const status=document.getElementById('status');
  const resetBtn=document.getElementById('resetBtn');
  status.className='note';
  status.textContent='Lokale oder eingebettete Vorschau erkannt. Klicke unten, um den Reset auf der richtigen Online-Seite auszuführen.';
  resetBtn.textContent='Online-Reset öffnen';
}
</script>
</body>
</html>
